services:
  - type: web
    name: shopflow
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/migrate.mjs && node app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_DRIVE_BEFORE_ACK
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
